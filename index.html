<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1424">
<title>Taksit Takip</title>

<link rel="apple-touch-icon" href="icon.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0E1424;
    --bg-glow:#16204A;
    --surface:#161D33;
    --surface-2:#1C2540;
    --border:#2A3457;
    --border-soft:#212A4A;
    --text:#EDEFF6;
    --text-dim:#8C96B8;
    --text-faint:#5C6690;
    --amber:#E8A33D;
    --amber-dim:#A97627;
    --teal:#45C7B8;
    --red:#E1594E;
    --radius-card:16px;
    --radius-sm:10px;
    font-size:16px;
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
  }

  html{
    background-color:#0E1424 !important;
    color-scheme:dark;
  }

  body{
    background-color:#0E1424 !important;
    color:#EDEFF6 !important;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    background-color:#0E1424;
    min-height:100vh;
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  .tabular{
    font-variant-numeric:tabular-nums;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 16px;
    font-size:.88rem;
    font-weight:600;
    transition:
      background .15s ease,
      border-color .15s ease,
      transform .1s ease;
  }

  button:hover{
    background:#232D4E;
    border-color:#39447A;
  }

  button:active{
    transform:translateY(1px);
  }

  button.primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#231404;
  }

  button.primary:hover{
    background:#F0B255;
    border-color:#F0B255;
  }

  button.ghost{
    background:transparent;
    border-color:transparent;
    color:var(--text-dim);
    padding:6px 8px;
    font-size:.8rem;
  }

  button.ghost:hover{
    background:var(--surface-2);
    color:var(--text);
  }

  button.danger-ghost{
    color:var(--red);
  }

  button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }

  /* ---------- Top bar ---------- */

  header.topbar{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
  }

  .brand h1{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-.01em;
    margin:0 0 4px;
  }

  .brand p{
    margin:0;
    color:var(--text-dim);
    font-size:.88rem;
  }

  .summary-row{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
  }

  .summary-item .label{
    display:block;
    font-size:.76rem;
    color:var(--text-dim);
    margin-bottom:4px;
  }

  .summary-item .value{
    font-size:1.5rem;
    font-weight:700;
    color:var(--amber);
  }

  .actions{
    display:flex;
    gap:10px;
  }

  /* ---------- Cards ---------- */

  section.cards-panel{
    margin-bottom:34px;
  }

  .cards-panel h2,
  .months h2{
    font-size:.82rem;
    font-weight:600;
    color:var(--text-dim);
    margin:0 0 12px;
  }

  .cards-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
    -webkit-overflow-scrolling:touch;
  }

  .card-chip{
    position:relative;
    flex:0 0 auto;
    width:190px;
    height:110px;
    border-radius:var(--radius-card);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:#fff;
    overflow:hidden;
    box-shadow:0 8px 20px -10px rgba(0,0,0,.6);
    user-select:none;
    -webkit-user-select:none;
    touch-action:pan-x;
  }

  .card-chip::after{
    content:"";
    position:absolute;
    right:-30px;
    top:-30px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.10);
    pointer-events:none;
  }

  .card-chip.long-pressing{
    transform:scale(.97);
    transition:transform .15s ease;
  }

  .card-chip .chip-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:2;
  }

  .card-chip .chip-icon{
    width:26px;
    height:18px;
    border-radius:4px;
    background:rgba(255,255,255,.75);
  }

  .card-chip .chip-actions{
    display:flex;
    gap:4px;
    position:relative;
    z-index:5;
  }

  .card-chip .chip-actions button{
    background:rgba(0,0,0,.25);
    border:none;
    color:#fff;
    width:28px;
    height:28px;
    padding:0;
    border-radius:7px;
    font-size:.8rem;
    line-height:1;
    position:relative;
    z-index:6;
  }

  .card-chip .chip-actions button:hover{
    background:rgba(0,0,0,.45);
  }

  .card-chip .chip-name{
    font-weight:700;
    font-size:1rem;
    letter-spacing:.01em;
    text-shadow:0 1px 3px rgba(0,0,0,.25);
    position:relative;
    z-index:2;
  }

  .card-chip .chip-total{
    font-size:.76rem;
    opacity:.9;
    position:relative;
    z-index:2;
  }

  .card-longpress-hint{
    position:absolute;
    bottom:7px;
    right:9px;
    font-size:.55rem;
    opacity:.55;
    z-index:2;
  }

  .add-card-chip{
    flex:0 0 auto;
    width:190px;
    height:110px;
    border-radius:var(--radius-card);
    border:1.5px dashed var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:.85rem;
  }

  .add-card-chip:hover{
    border-color:var(--amber-dim);
    color:var(--amber);
  }

  .empty-note{
    color:var(--text-faint);
    font-size:.85rem;
    padding:8px 2px;
  }

  /* ---------- Tabs ---------- */

  .section-tabs{
    display:flex;
    gap:4px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border-soft);
  }

  .section-tab{
    border:none;
    background:transparent;
    color:var(--text-faint);
    border-radius:8px 8px 0 0;
    padding:10px 14px;
    font-size:.82rem;
    font-weight:600;
  }

  .section-tab:hover{
    background:var(--surface);
    color:var(--text);
    border-color:transparent;
  }

  .section-tab.active{
    color:var(--amber);
    background:var(--surface);
    border-bottom:2px solid var(--amber);
  }

  /* ---------- Months ---------- */

  .months{
    display:flex;
    flex-direction:column;
  }

  details.month-row{
    border-bottom:1px solid var(--border-soft);
  }

  details.month-row summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 4px;
    gap:12px;
  }

  details.month-row summary::-webkit-details-marker{
    display:none;
  }

  .month-name{
    font-weight:600;
    font-size:.96rem;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:170px;
  }

  .month-name .chevron{
    color:var(--text-faint);
    font-size:.7rem;
    transition:transform .15s ease;
    display:inline-block;
  }

  details[open] .chevron{
    transform:rotate(90deg);
  }

  .month-summary-right{
    display:flex;
    align-items:center;
    gap:16px;
    color:var(--text-dim);
    font-size:.85rem;
  }

  .month-summary-right .month-total{
    color:var(--text);
    font-weight:700;
    font-size:.98rem;
  }

  .month-dots{
    display:flex;
    gap:4px;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
  }

  .month-body{
    padding:2px 4px 18px 4px;
  }

  .month-empty{
    color:var(--text-faint);
    font-size:.85rem;
    padding:6px 0 12px;
  }

  /* ---------- Card monthly totals ---------- */

  .month-card-summary{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 0 14px;
  }

  .month-card-summary-title{
    width:100%;
    color:var(--text-faint);
    font-size:.7rem;
    font-weight:600;
    margin-bottom:1px;
  }

  .month-card-total{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:9px;
    padding:7px 9px;
    font-size:.76rem;
  }

  .month-card-total .card-total-name{
    color:var(--text-dim);
  }

  .month-card-total strong{
    color:var(--text);
    font-weight:700;
  }

  /* ---------- Transaction table ---------- */

  table.tx-table{
    width:100%;
    border-collapse:collapse;
    font-size:.87rem;
  }

  table.tx-table th{
    text-align:left;
    font-weight:500;
    color:var(--text-faint);
    font-size:.72rem;
    padding:0 8px 8px;
    border-bottom:1px solid var(--border-soft);
  }

  table.tx-table td{
    padding:9px 8px;
    border-bottom:1px solid var(--border-soft);
    vertical-align:middle;
  }

  table.tx-table tr:last-child td{
    border-bottom:none;
  }

  .card-tag{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .card-tag .dot{
    width:10px;
    height:10px;
    flex:0 0 auto;
  }

  .tx-note{
    color:var(--text-dim);
  }

  .tx-progress{
    color:var(--text-faint);
    font-size:.78rem;
  }

  .tx-amount{
    text-align:right;
    font-weight:600;
  }

  .tx-actions{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:2px;
  }

  .tx-action{
    color:var(--text-faint);
    background:none;
    border:none;
    padding:4px 6px;
    font-size:.82rem;
    border-radius:6px;
  }

  .tx-action:hover{
    color:var(--text);
    background:var(--surface-2);
    border-color:transparent;
  }

  .tx-action.delete:hover{
    color:var(--red);
  }

  tfoot td{
    padding-top:10px;
    font-weight:700;
    border-bottom:none !important;
  }

  /* ---------- Paid installment ---------- */

  .installment-row{
    position:relative;
    transition:
      opacity .2s ease,
      background .2s ease;
    user-select:none;
    -webkit-user-select:none;
    touch-action:pan-y;
    cursor:default;
  }

  .installment-row.long-pressing{
    background:rgba(232,163,61,.07);
  }

  .installment-row.paid{
    opacity:.38;
  }

  .installment-row.paid .tx-amount{
    text-decoration:line-through;
  }

  .paid-badge{
    display:inline-block;
    margin-left:6px;
    font-size:.62rem;
    color:var(--teal);
    border:1px solid rgba(69,199,184,.35);
    border-radius:5px;
    padding:2px 4px;
    vertical-align:middle;
  }

  .longpress-hint{
    color:var(--text-faint);
    font-size:.62rem;
  }

  /* ---------- Modal ---------- */

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,8,18,.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }

  .modal-overlay.open{
    display:flex;
  }

  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    width:100%;
    max-width:420px;
    padding:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
    max-height:90vh;
    overflow-y:auto;
  }

  .modal.large{
    max-width:500px;
  }

  .modal h2{
    margin:0 0 16px;
    font-size:1.1rem;
  }

  .modal-subtitle{
    color:var(--text-dim);
    font-size:.78rem;
    margin:-8px 0 16px;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:.8rem;
    color:var(--text-dim);
    margin-bottom:6px;
  }

  .field input,
  .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:.92rem;
    font-family:inherit;
  }

  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--amber-dim);
  }

  .field input[type="number"]{
    -webkit-appearance:none;
    appearance:none;
  }

  .field-row{
    display:flex;
    gap:12px;
  }

  .field-row .field{
    flex:1;
  }

  .field-row select{
    flex:1;
  }

  .swatches{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .swatch{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }

  .swatch.selected{
    border-color:#fff;
  }

  .preview-box{
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:.82rem;
    color:var(--text-dim);
    margin-bottom:14px;
    min-height:20px;
  }

  .preview-box strong{
    color:var(--amber);
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }

  .modal-error{
    color:var(--red);
    font-size:.8rem;
    margin:-6px 0 12px;
  }

  /* ---------- Card detail ---------- */

  .card-month-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:55vh;
    overflow-y:auto;
    padding-right:3px;
  }

  .card-month-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:11px 12px;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:9px;
  }

  .card-month-item.past{
    opacity:.48;
  }

  .card-month-name{
    font-size:.82rem;
    color:var(--text-dim);
  }

  .card-month-value{
    font-size:.88rem;
    font-weight:700;
    color:var(--text);
  }

  .card-month-item.current{
    border-color:rgba(232,163,61,.35);
  }

  .card-detail-total{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
  }

  .card-detail-total span{
    color:var(--text-dim);
    font-size:.78rem;
  }

  .card-detail-total strong{
    color:var(--amber);
    font-size:1rem;
  }

  @media(max-width:520px){
    header.topbar{
      flex-direction:column;
      align-items:flex-start;
    }

    .summary-row{
      width:100%;
    }

    .summary-item{
      flex:1;
    }

    .actions{
      width:100%;
    }

    .actions button{
      flex:1;
    }

    .month-name{
      min-width:0;
    }

    table.tx-table{
      font-size:.8rem;
    }

    table.tx-table th,
    table.tx-table td{
      padding-left:4px;
      padding-right:4px;
    }

    .tx-note{
      max-width:95px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .tx-actions{
      gap:0;
    }

    .tx-action{
      padding:4px;
    }

    .month-card-total{
      flex:1 1 auto;
      justify-content:space-between;
    }

    .longpress-hint{
      display:none;
    }
  }
</style>
</head>

<body>

<div id="app">

  <header class="topbar">

    <div class="brand">
      <h1>Taksit Takip</h1>
      <p>Kredi kartı taksitlerinizi aylara göre planlayın</p>
    </div>

    <div class="summary-row">
      <div class="summary-item">
        <span class="label">Ödenmemiş Taksitlerin Toplamı</span>
        <span class="value tabular" id="totalAmount">₺0,00</span>
      </div>
    </div>

    <div class="actions">
      <button type="button" id="btnAddTx" class="primary">
        + Taksit Ekle
      </button>
    </div>

  </header>

  <section class="cards-panel">

    <h2>Kartlarım</h2>

    <div class="cards-scroll" id="cardsScroll"></div>

  </section>

  <section class="months">

    <div class="section-tabs">

      <button
        type="button"
        id="tabCurrent"
        class="section-tab active">
        Aylara Göre Taksitler
      </button>

      <button
        type="button"
        id="tabPast"
        class="section-tab">
        Geçmiş Aylar
      </button>

    </div>

    <div id="monthsContainer"></div>

  </section>

</div>


<!-- =========================================================
     KART EKLE / DÜZENLE MODALI
========================================================= -->

<div class="modal-overlay" id="cardModalOverlay">

  <div class="modal">

    <h2 id="cardModalTitle">Kart Ekle</h2>

    <div class="field">

      <label for="cardNameInput">
        Kart Adı
      </label>

      <input
        id="cardNameInput"
        maxlength="24"
        placeholder="Kart adı">

    </div>

    <div class="field">

      <label>Renk</label>

      <div
        class="swatches"
        id="colorSwatches">
      </div>

    </div>

    <div
      class="modal-error"
      id="cardModalError"
      style="display:none;">
    </div>

    <div class="modal-actions">

      <button
        type="button"
        id="cardModalCancel">
        Vazgeç
      </button>

      <button
        type="button"
        id="cardModalSave"
        class="primary">
        Kaydet
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     TAKSİT EKLE / DÜZENLE MODALI
========================================================= -->

<div class="modal-overlay" id="txModalOverlay">

  <div class="modal">

    <h2 id="txModalTitle">Yeni Taksit Ekle</h2>

    <div class="field">

      <label for="txCardSelect">
        Kart
      </label>

      <select id="txCardSelect"></select>

    </div>

    <div class="field-row">

      <div class="field">

        <label for="txAmount">
          Toplam Tutar (₺)
        </label>

        <input
          id="txAmount"
          type="number"
          inputmode="numeric"
          min="1"
          step="1"
          placeholder="0">

      </div>

      <div class="field">

        <label for="txCount">
          Taksit Sayısı
        </label>

        <select id="txCount"></select>

      </div>

    </div>

    <div class="field">

      <label>İlk Ödeme Ayı</label>

      <div class="field-row">

        <select id="txFirstMonthSel"></select>

        <select id="txFirstYearSel"></select>

      </div>

    </div>

    <div class="field">

      <label for="txNote">
        Not
      </label>

      <input
        id="txNote"
        maxlength="60">

    </div>

    <div
      class="preview-box"
      id="txPreview">
      Aylık tutarı görmek için formu doldurun.
    </div>

    <div
      class="modal-error"
      id="txModalError"
      style="display:none;">
    </div>

    <div class="modal-actions">

      <button
        type="button"
        id="txModalCancel">
        Vazgeç
      </button>

      <button
        type="button"
        id="txModalSave"
        class="primary">
        Ekle
      </button>

    </div>

  </div>

</div>


<!-- =========================================================
     KART AYLIK DETAY MODALI
========================================================= -->

<div class="modal-overlay" id="cardDetailOverlay">

  <div class="modal large">

    <h2 id="cardDetailTitle">
      Kart Detayı
    </h2>

    <div class="modal-subtitle">
      Bu kartın aylara göre taksit dağılımı
    </div>

    <div
      class="card-detail-total"
      id="cardDetailTotal">
    </div>

    <div
      class="card-month-list"
      id="cardMonthList">
    </div>

    <div class="modal-actions">

      <button
        type="button"
        id="cardDetailClose">
        Kapat
      </button>

    </div>

  </div>

</div>


<script>
(function(){

  "use strict";


  /* =========================================================
     SABİTLER
  ========================================================= */

  var STORAGE_KEY = "taksitTakipData_v1";

  var MAX_CARDS = 10;

  var MONTH_NAMES = [
    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",

        var parsed =
          JSON.parse(raw);

        if(
          parsed &&
          Array.isArray(parsed.cards) &&
          Array.isArray(parsed.transactions)
        ){

          state = parsed;

          state.transactions.forEach(
            function(tx){

              if(
                !Array.isArray(
                  tx.paidInstallments
                )
              ){
                tx.paidInstallments = [];
              }

            }
          );

        }

      }

    }catch(e){

      console.warn(
        "Depolanan veri okunamadı:",

      );

    }

  }

  /* =========================================================
     AY YARDIMCILARI
  ========================================================= */

  function currentMonthKey(){

    var d = new Date();

    return d.getFullYear() +
      "-" +
      String(
        d.getMonth()+1
      ).padStart(2,"0");

  }


  function addMonths(
    monthKey,
    n
  ){

    var parts =
      monthKey.split("-");

    var y =
      parseInt(
        parts[0],
        10
      );

    var m =
      parseInt(
        parts[1],
        10
      ) - 1;

    var total =
      y * 12 +
      m +
      n;

    var ny =
      Math.floor(
        total / 12
      );

    var nm =
      ((total % 12) + 12) % 12;

    return ny +
      "-" +
      String(
        nm + 1
      ).padStart(2,"0");

  }


  function monthLabel(
    monthKey
  ){

    var parts =
      monthKey.split("-");

    var y =
      parseInt(
        parts[0],
        10
      );

    var m =
      parseInt(
        parts[1],
        10
      ) - 1;

    return MONTH_NAMES[m] +
      " " +
      y;

  }


  function compareMonths(
    a,
    b
  ){

    return a < b ?
      -1 :
      (
        a > b ?
        1 :
        0
      );

  }


  /* =========================================================
     PARA FORMATLAMA
  ========================================================= */

  function formatCurrency(n){

    var v =
      Math.round(
        (n + Number.EPSILON) *
        100
      ) / 100;

    return "₺" +
      v.toLocaleString(
        "tr-TR",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );

  }


  /* =========================================================
     TAKSİT HESAPLAMA
  ========================================================= */

  function computeInstallmentAmounts(
    total,
    count
  ){

    var base =
      Math.floor(
        (total / count) * 100
      ) / 100;

    var amounts = [];

    var runningSum = 0;

    for(
      var i = 0;
      i < count - 1;
      i++
    ){

      amounts.push(base);

      runningSum += base;

    }

    var last =
      Math.round(
        (total - runningSum) * 100
      ) / 100;

    amounts.push(last);

    return amounts;

  }


  /* =========================================================
     ÖDEME DURUMU
  ========================================================= */

  function isInstallmentPaid(
    tx,
    installmentIndex,
    monthKey
  ){

    if(
      Array.isArray(
        tx.paidInstallments
      ) &&
      tx.paidInstallments.indexOf(
        installmentIndex
      ) !== -1
    ){
      return true;
    }

    var current =
      new Date();

    var todayDay =
      current.getDate();

    var currentKey =
      current.getFullYear() +
      "-" +
      String(
        current.getMonth()+1
      ).padStart(2,"0");

    /*
     * Geçmiş aylar otomatik olarak
     * ödenmiş kabul edilir.
     */
    if(
      compareMonths(
        monthKey,
        currentKey
      ) < 0
    ){
      return true;
    }

    /*
     * Ayın 16'sından itibaren
     * mevcut ayın taksidi otomatik ödenmiş.
     */
    if(
      monthKey === currentKey &&
      todayDay >= 16
    ){
      return true;
    }

    return false;

  }


  function toggleInstallmentPaid(
    txId,
    installmentIndex
  ){

    var tx =
      state.transactions.find(
        function(t){
          return t.id === txId;
        }
      );

    if(!tx){
      return;
    }

    if(
      !Array.isArray(
        tx.paidInstallments
      )
    ){
      tx.paidInstallments = [];
    }

    var index =
      tx.paidInstallments.indexOf(
        installmentIndex
      );

    if(index === -1){

      tx.paidInstallments.push(
        installmentIndex
      );

    }else{

      tx.paidInstallments.splice(
        index,
        1
      );

    }

    saveState();

    renderAll();

  }


  /* =========================================================
     BREAKDOWN
  ========================================================= */

  function buildBreakdown(){

    var map = {};

    state.transactions.forEach(
      function(tx){

        var amounts =
          computeInstallmentAmounts(
            tx.totalAmount,
            tx.count
          );

        for(
          var i = 0;
          i < tx.count;
          i++
        ){

          var mk =
            addMonths(
              tx.firstMonth,
              i
            );

          if(!map[mk]){
            map[mk] = [];
          }

          var installmentIndex =
            i + 1;

          var paid =
            isInstallmentPaid(
              tx,
              installmentIndex,
              mk
            );

          map[mk].push({

            cardId:tx.cardId,

            amount:amounts[i],

            note:tx.note,

            txId:tx.id,

            index:installmentIndex,

            count:tx.count,

            paid:paid,

            monthKey:mk

          });

        }

      }
    );

    return map;

  }


  /* =========================================================
     GÖRÜNÜR AYLAR
  ========================================================= */

  function getVisibleCurrentMonths(){

    var start =
      currentMonthKey();

    var months = [];

    for(
      var i=0;
      i<12;
      i++
    ){

      months.push(
        addMonths(
          start,
          i
        )
      );

    }

    return months;

  }


  function getPastMonths(
    breakdown
  ){

    var current =
      currentMonthKey();

    var months =
      Object.keys(
        breakdown
      )
      .filter(
        function(mk){

          return compareMonths(
            mk,
            current
          ) < 0;

        }
      )
      .sort(compareMonths);

    var result = [];

    /*
     * Son 12 geçmiş ay.
     */
    for(
      var i=months.length-1;
      i>=0 &&
      result.length<12;
      i--
    ){

      result.unshift(
        months[i]
      );

    }

    return result;

  }


  /* =========================================================
     CARD HELPERS
  ========================================================= */

  function getCard(id){

    return state.cards.find(
      function(c){
        return c.id === id;
      }
    );

  }


  function nextAvailableColor(){

    var used = {};

    state.cards.forEach(
      function(c){
        used[c.color] = true;
      }
    );

    for(
      var i=0;
      i<PALETTE.length;
      i++
    ){

      if(
        !used[
          PALETTE[i]
        ]
      ){

        return PALETTE[i];

      }

    }

    return PALETTE[
      state.cards.length %
      PALETTE.length
    ];

  }


  function cardTotal(
    cardId
  ){

    var sum = 0;

    state.transactions.forEach(
      function(tx){

        if(
          tx.cardId !== cardId
        ){
          return;
        }

        var amounts =
          computeInstallmentAmounts(
            tx.totalAmount,
            tx.count
          );

        for(
          var i=0;
          i<tx.count;
          i++
        ){

          var mk =
            addMonths(
              tx.firstMonth,
              i
            );

          if(
            !isInstallmentPaid(
              tx,
              i+1,
              mk
            )
          ){

            sum += amounts[i];

          }

        }

      }
    );

    return sum;

  }


  /* =========================================================
     GENEL TOPLAM
  ========================================================= */

  function calculateOutstandingTotal(){

    var total = 0;

    var breakdown =
      buildBreakdown();

    var current =
      currentMonthKey();

    Object.keys(
      breakdown
    ).forEach(
      function(mk){

        if(
          compareMonths(
            mk,
            current
          ) < 0
        ){
          return;
        }

        breakdown[mk].forEach(
          function(item){

            if(!item.paid){

              total += item.amount;

            }

          }
        );

      }
    );

    return total;

  }

  function shade(
    hex,
    percent
  ){

    var num =
      parseInt(
        hex.replace("#",""),
        16
      );

    var r =
      (num >> 16) +
      Math.round(
        2.55 * percent
      );

    var g =
      ((num >> 8) & 0x00FF) +
      Math.round(
        2.55 * percent
      );

    var b =
      (num & 0x0000FF) +
      Math.round(
        2.55 * percent
      );

    r =
      Math.min(
        255,
        Math.max(0,r)
      );

    g =
      Math.min(
        255,
        Math.max(0,g)
      );

    b =
      Math.min(
        255,
        Math.max(0,b)
      );

    return "#" +
      (
        0x1000000 +
        r * 0x10000 +
        g * 0x100 +
        b
      )
      .toString(16)
      .slice(1);

  }


  /* =========================================================
     KARTA UZUN BASMA
  ========================================================= */

  function setupCardLongPress(
    element,
    cardId
  ){

    var timer = null;

    var startX = 0;

    var startY = 0;

    var triggered = false;


    element.addEventListener(
      "pointerdown",
      function(e){

        /*
         * Düzenle / sil butonlarından gelen
         * pointer olaylarını dikkate alma.
         */
        if(
          e.target.closest &&
          e.target.closest(
            ".chip-actions"
          )
        ){
          return;
        }

        startX = e.clientX;

        startY = e.clientY;

        triggered = false;

        element.classList.add(
          "long-pressing"
        );

        timer =
          setTimeout(
            function(){

              triggered = true;

              element.classList.remove(
                "long-pressing"
              );

              openCardDetail(
                cardId
              );

            },
            650
          );

      }
    );


    element.addEventListener(
      "pointermove",
      function(e){

        if(!timer){
          return;
        }

        var dx =
          Math.abs(
            e.clientX - startX
          );

        var dy =
          Math.abs(
            e.clientY - startY
          );

        if(
          dx > 12 ||
          dy > 12
        ){

          clearTimeout(timer);

          timer = null;

          element.classList.remove(
            "long-pressing"
          );

        }

      }
    );


    element.addEventListener(
      "pointerup",
      function(){

        if(timer){

          clearTimeout(timer);

          timer = null;

        }

        element.classList.remove(
          "long-pressing"
        );

      }
    );


    element.addEventListener(
      "pointercancel",
      function(){

        if(timer){

          clearTimeout(timer);

          timer = null;

        }

        element.classList.remove(
          "long-pressing"
        );

      }
    );

  }


  /* =========================================================

  ========================================================= */

  function openCardDetail(
    cardId
  ){

    var card =
      getCard(cardId);

    if(!card){
      return;
    }

    document.getElementById(
      "cardDetailTitle"
    ).textContent =
      card.name +
      " — Aylık Detay";


    var list =
      document.getElementById(
        "cardMonthList"
      );

    list.innerHTML = "";


    /*
     * Kartın tüm işlemlerinden
     * ay bazlı toplamları oluştur.
     */
    var monthly = {};

    state.transactions.forEach(
      function(tx){

        if(
          tx.cardId !== cardId
        ){
          return;
        }

        var amounts =
          computeInstallmentAmounts(
            tx.totalAmount,
            tx.count
          );

        for(
          var i=0;
          i<tx.count;
          i++
        ){

          var mk =
            addMonths(
              tx.firstMonth,
              i
            );

          if(
            !monthly[mk]
          ){
            monthly[mk] = 0;
          }

          /*
           * Kart detayında o ayın gerçek
           * taksit toplamını gösteriyoruz.
           */
          monthly[mk] +=
            amounts[i];

        }

      }
    );


    var keys =
      Object.keys(
        monthly
      );


    if(keys.length === 0){

      var empty =
        document.createElement(
          "div"
        );

      empty.className =
        "month-empty";

      empty.textContent =
        "Bu karta ait kayıtlı taksit bulunmuyor.";

      list.appendChild(
        empty
      );

      document.getElementById(
        "cardDetailTotal"
      ).innerHTML =
        "<span>Toplam</span>" +
        "<strong>₺0,00</strong>";

      document.getElementById(
        "cardDetailOverlay"
      ).classList.add("open");

      return;

    }


    keys.sort(
      compareMonths
    );


    /*
     * Sadece anlamlı ayları gösteriyoruz.
     * Geçmiş aylar da gösterilir.
     */
    var totalAll = 0;

    keys.forEach(
      function(mk){

        var amount =
          monthly[mk];

        totalAll += amount;


        var item =
          document.createElement(
            "div"
          );

        item.className =
          "card-month-item";


        var current =
          currentMonthKey();


        if(
          compareMonths(
            mk,
            current
          ) < 0
        ){

          item.classList.add(
            "past"
          );

        }

        if(
          mk === current
        ){

          item.classList.add(
            "current"
          );

        }


        var name =
          document.createElement(
            "div"
          );

        name.className =
          "card-month-name";

        name.textContent =
          monthLabel(mk);


        var value =
          document.createElement(
            "div"
          );

        value.className =
          "card-month-value tabular";

        value.textContent =
          formatCurrency(
            amount
          );


        item.appendChild(
          name
        );

        item.appendChild(
          value
        );

        list.appendChild(
          item
        );

      }
    );


    /*
     * Kartın gelecekteki toplamı.
     */
    var remaining =
      cardTotal(cardId);


    document.getElementById(
      "cardDetailTotal"
    ).innerHTML =
      "<span>Ödenmemiş kalan toplam</span>" +
      "<strong>" +
      formatCurrency(
        remaining
      ) +
      "</strong>";


    document.getElementById(
      "cardDetailOverlay"
    ).classList.add("open");

  }

  /* =========================================================
     KART BAZLI AYLIK TOPLAMLAR
  ========================================================= */

  function calculateMonthlyCardTotals(
    items,
    isPast
  ){

    var totals = {};

    items.forEach(
      function(item){

        /*
         * Geçmiş ayda tüm tutar,
         * mevcut/gelecek ayda ise
         * ödenmemiş tutar gösterilir.
         */
        if(
          !isPast &&
          item.paid
        ){
          return;
        }

        if(
          !totals[item.cardId]
        ){
          totals[item.cardId] = 0;
        }

        totals[item.cardId] +=
          item.amount;

      }
    );

    return totals;

  }


  function renderMonthCardSummary(
    items,
    isPast
  ){

    var totals =
      calculateMonthlyCardTotals(
        items,
        isPast
      );

    var wrapper =
      document.createElement(
        "div"
      );

    wrapper.className =
      "month-card-summary";


    var title =
      document.createElement(
        "div"
      );

    title.className =
      "month-card-summary-title";

    title.textContent =
      isPast ?
      "Kart bazlı ay toplamı" :
      "Ödenmemiş kart bazlı toplam";

    wrapper.appendChild(
      title
    );


    var cardIds =
      Object.keys(
        totals
      );


    cardIds.sort(
      function(a,b){

        var ca =
          getCard(a);

        var cb =
          getCard(b);

        return (
          ca ? ca.name : ""
        ).localeCompare(
          cb ? cb.name : "",
          "tr"
        );

      }
    );


    cardIds.forEach(
      function(cardId){

        var card =
          getCard(cardId);

        var item =
          document.createElement(
            "div"
          );

        item.className =
          "month-card-total";


        var dot =
          document.createElement(
            "span"
          );

        dot.className =
          "dot";

        dot.style.background =
          card ?
          card.color :
          "#666";


        var name =
          document.createElement(
            "span"
          );

  /* =========================================================
     TAKSİT UZUN BASMA
  ========================================================= */

  function setupInstallmentLongPress(
    row,
    item
  ){

    var timer = null;

    var startX = 0;

    var startY = 0;


    row.addEventListener(
      "pointerdown",
      function(e){

        /*
         * Düzenle ve sil butonlarına
         * uzun basma uygulanmasın.
         */
        if(
          e.target.closest &&
          e.target.closest(
            ".tx-actions"
          )
        ){
          return;
        }


        startX =
          e.clientX;

        startY =
          e.clientY;


        row.classList.add(
          "long-pressing"
        );


        timer =
          setTimeout(
            function(){

              timer = null;

              row.classList.remove(
                "long-pressing"
              );

              /*
               * Uzun basma ile ödenmiş/ödenmemiş
               * durumunu değiştir.
               */
              toggleInstallmentPaid(
                item.txId,
                item.index
              );

            },
            650
          );

      }
    );


    row.addEventListener(
      "pointermove",
      function(e){

        if(!timer){
          return;
        }

        var dx =
          Math.abs(
            e.clientX - startX
          );

        var dy =
          Math.abs(
            e.clientY - startY
          );

        /*
         * Parmağı sürüklemeye başladıysa
         * uzun basmayı iptal et.
         */
        if(
          dx > 12 ||
          dy > 12
        ){

          clearTimeout(timer);

          timer = null;

          row.classList.remove(
            "long-pressing"
          );

        }

      }
    );


    row.addEventListener(
      "pointerup",
      function(){

        if(timer){

          clearTimeout(timer);

          timer = null;

        }

        row.classList.remove(
          "long-pressing"
        );

      }
    );


    row.addEventListener(
      "pointercancel",
      function(){

        if(timer){

          clearTimeout(timer);

          timer = null;

        }

        row.classList.remove(
          "long-pressing"
        );

      }
    );

  }

  function saveCard(){

    var name =
      document.getElementById(
        "cardNameInput"
      ).value.trim();


    if(!name){

      showError(
        "cardModalError",
        "Lütfen kart için bir ad girin."
      );

      return;

    }


    if(editingCardId){

      var card =
        getCard(
          editingCardId
        );

      if(!card){
        return;
      }

      card.name =
        name;

      card.color =
        selectedColor;

    }else{

      if(
        state.cards.length >=
        MAX_CARDS
      ){

        showError(
          "cardModalError",
          "En fazla " +
          MAX_CARDS +
          " kart ekleyebilirsiniz."
        );

        return;

      }


      state.cards.push({

        id:uid(),

        name:name,

        color:selectedColor

      });

    }


    saveState();

    renderAll();

    closeCardModal();

  }


  function deleteCard(
    cardId
  ){

    var card =
      getCard(cardId);

    if(!card){
      return;
    }


    var relatedCount =
      state.transactions.filter(
        function(tx){
          return tx.cardId === cardId;
        }
      ).length;


    var msg =
      relatedCount > 0 ?

      "Bu karta ait " +
      relatedCount +
      " taksit kaydı da silinecek. Devam edilsin mi?" :

      "\"" +
      card.name +
      "\" kartını silmek istediğinize emin misiniz?";


    if(
      !confirm(msg)
    ){
      return;
    }


    state.cards =
      state.cards.filter(
        function(c){
          return c.id !== cardId;
        }
      );


    state.transactions =
      state.transactions.filter(
        function(tx){
          return tx.cardId !== cardId;
        }
      );


    saveState();

    renderAll();

  }

  function updateTxPreview(){

    var amount =
      parseFloat(
        document.getElementById(
          "txAmount"
        ).value
      );


    var count =
      parseInt(
        document.getElementById(
          "txCount"
        ).value,
        10
      );


    var firstMonth =
      getSelectedFirstMonth();


    var box =
      document.getElementById(
        "txPreview"
      );


    if(
      !amount ||
      amount <= 0 ||
      !count ||
      count < 1 ||
      !firstMonth
    ){

      box.innerHTML =
        "Aylık tutarı görmek için formu doldurun.";

      return;

    }


    var amounts =
      computeInstallmentAmounts(
        amount,
        count
      );


    var lastMonth =
      addMonths(
        firstMonth,
        count - 1
      );


    box.innerHTML =
      "Aylık taksit: <strong>" +
      formatCurrency(
        amounts[0]
      ) +
      "</strong> · " +
      "Başlangıç: " +
      monthLabel(
        firstMonth
      ) +
      " · Bitiş: " +
      monthLabel(
        lastMonth
      );

  }


  /* =========================================================
     TAKSİT KAYDET / GÜNCELLE
  ========================================================= */

  function saveTx(){

    var cardId =
      document.getElementById(
        "txCardSelect"
      ).value;


    var amount =
      parseFloat(
        document.getElementById(
          "txAmount"
        ).value
      );


    var count =
      parseInt(
        document.getElementById(
          "txCount"
        ).value,
        10
      );


    var firstMonth =
      getSelectedFirstMonth();


    var note =
      document.getElementById(
        "txNote"
      ).value.trim();


    if(!cardId){

      showError(
        "txModalError",
        "Lütfen bir kart seçin."
      );

      return;

    }


    if(
      !amount ||
      amount <= 0
    ){

      showError(
        "txModalError",
        "Lütfen geçerli bir tutar girin."
      );

      return;

    }


    if(
      !count ||
      count < 1 ||
      count > 36
    ){

      showError(
        "txModalError",
        "Taksit sayısı 1 ile 36 arasında olmalıdır."
      );

      return;

    }


    if(!firstMonth){

      showError(
        "txModalError",
        "Lütfen ilk ödeme ayını seçin."
      );

      return;

    }


    /*
     * YENİ İŞLEM
     */
    if(
      !editingTransactionId
    ){

      state.transactions.push({

        id:uid(),

        cardId:cardId,

        totalAmount:
          Math.round(
            amount * 100
          ) / 100,

        count:count,

        firstMonth:firstMonth,

        note:note,

        paidInstallments:[]

      });

    }else{

      /*
       * MEVCUT İŞLEMİ GÜNCELLE
       */
      var tx =
        state.transactions.find(
          function(t){
            return t.id ===
              editingTransactionId;
          }
        );


      if(!tx){
        return;
      }


      tx.cardId =
        cardId;

      tx.totalAmount =
        Math.round(
          amount * 100
        ) / 100;

      tx.count =
        count;

      tx.firstMonth =
        firstMonth;

      tx.note =
        note;


      /*
       * Taksit sayısı azaltılmışsa
       * artık var olmayan taksitlerin
       * ödeme kayıtlarını temizle.
       */
      if(
        !Array.isArray(
          tx.paidInstallments
        )
      ){

        tx.paidInstallments = [];

      }


      tx.paidInstallments =
        tx.paidInstallments.filter(
          function(index){

            return index >= 1 &&
              index <= count;

          }
        );

    }


    saveState();

    renderAll();

    closeTxModal();

  }


  /* =========================================================
     İŞLEM SİL
  ========================================================= */

  function deleteTransaction(
    txId
  ){

    if(
      !confirm(
        "Bu taksit kaydını silmek istediğinize emin misiniz?"
      )
    ){

      return;

    }


    state.transactions =
      state.transactions.filter(
        function(tx){

          return tx.id !== txId;

        }
      );


    saveState();

    renderAll();

  }


  /* =========================================================
     HATA
  ========================================================= */

  function showError(
    id,
    msg
  ){

    var el =
      document.getElementById(
        id
      );

    el.textContent =
      msg;

    el.style.display =
      "block";

  }


  function hideError(
    id
  ){

    var el =
      document.getElementById(
        id
      );

    el.style.display =
      "none";

  }


  /* =========================================================
     TABS
  ========================================================= */

  function setActiveTab(
    tab
  ){

    activeTab =
      tab;


    document.getElementById(
      "tabCurrent"
    ).classList.toggle(
      "active",
      tab === "current"
    );


    document.getElementById(
      "tabPast"
    ).classList.toggle(
      "active",
      tab === "past"
    );


    renderMonths();

  }


  /* =========================================================
     MODAL DIŞINA TIKLAMA
  ========================================================= */

  document.getElementById(
    "cardModalOverlay"
  ).addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeCardModal();

      }

    }
  );


  document.getElementById(
    "txModalOverlay"
  ).addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeTxModal();

      }

    }
  );


  document.getElementById(
    "cardDetailOverlay"
  ).addEventListener(
    "click",
    function(e){

      if(
        e.target === this
      ){

        closeCardDetail();

      }

    }
  );


  /* =========================================================
     EVENT WIRING
  ========================================================= */

  document.getElementById(
    "btnAddTx"
  ).addEventListener(
    "click",
    function(){

      openTxModal();

    }
  );


  document.getElementById(
    "tabCurrent"
  ).addEventListener(
    "click",
    function(){

      setActiveTab(
        "current"
      );

    }
  );


  document.getElementById(
    "tabPast"
  ).addEventListener(
    "click",
    function(){

      setActiveTab(
        "past"
      );

    }
  );


  document.getElementById(
    "cardModalCancel"
  ).addEventListener(
    "click",
    closeCardModal
  );


  document.getElementById(
    "cardModalSave"
  ).addEventListener(
    "click",
    saveCard
  );


  document.getElementById(
    "txModalCancel"
  ).addEventListener(
    "click",
    closeTxModal
  );


  document.getElementById(
    "txModalSave"
  ).addEventListener(
    "click",
    saveTx
  );


  document.getElementById(
    "cardDetailClose"
  ).addEventListener(
    "click",
    closeCardDetail
  );


  document.getElementById(
    "txAmount"
  ).addEventListener(
    "input",
    updateTxPreview
  );


  document.getElementById(
    "txCount"
  ).addEventListener(
    "change",
    updateTxPreview
  );


  document.getElementById(
    "txFirstMonthSel"
  ).addEventListener(
    "change",
    updateTxPreview
  );


  document.getElementById(
    "txFirstYearSel"
  ).addEventListener(
    "change",
    updateTxPreview
  );


  document.addEventListener(
    "keydown",
    function(e){

      if(
        e.key === "Escape"
      ){

        closeCardModal();

        closeTxModal();

        closeCardDetail();

      }

    }
  );


  /* =========================================================
     INIT
  ========================================================= */

  populateMonthYearSelects();

  populateInstallmentSelect();

  loadState();

  renderAll();

})();
</script>

</body>
</html>
