<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1424">
<title>Taksit Takip</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0E1424;
    --bg-glow: #16204A;
    --surface: #161D33;
    --surface-2: #1C2540;
    --border: #2A3457;
    --border-soft: #212A4A;
    --text: #EDEFF6;
    --text-dim: #8C96B8;
    --text-faint: #5C6690;
    --amber: #E8A33D;
    --amber-dim: #A97627;
    --teal: #45C7B8;
    --red: #E1594E;
    --radius-card: 16px;
    --radius-sm: 10px;
    font-size: 16px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  html{
    background-color:#0E1424 !important;
    color-scheme:dark;
  }

  body{
    background-color:#0E1424 !important;
    color:#EDEFF6 !important;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    background-color:#0E1424;
    min-height:100vh;
    max-width:960px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  .tabular{
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Top bar ---------- */

  header.topbar{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
  }

  .brand h1{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }

  .brand p{
    margin:0;
    color:var(--text-dim);
    font-size:0.88rem;
  }

  .summary-row{
    display:flex;
    gap:28px;
    flex-wrap:wrap;
  }

  .summary-item .label{
    display:block;
    font-size:0.76rem;
    color:var(--text-dim);
    margin-bottom:4px;
  }

  .summary-item .value{
    font-size:1.5rem;
    font-weight:700;
    color:var(--amber);
  }

  .actions{
    display:flex;
    gap:10px;
  }

  button{
    font-family:inherit;
    cursor:pointer;
    border-radius:var(--radius-sm);
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    padding:10px 16px;
    font-size:0.88rem;
    font-weight:600;
    transition:
      background .15s ease,
      border-color .15s ease,
      transform .1s ease;
  }

  button:hover{
    background:#232D4E;
    border-color:#39447A;
  }

  button:active{
    transform:translateY(1px);
  }

  button.primary{
    background:var(--amber);
    border-color:var(--amber);
    color:#231404;
  }

  button.primary:hover{
    background:#F0B255;
    border-color:#F0B255;
  }

  button.ghost{
    background:transparent;
    border-color:transparent;
    color:var(--text-dim);
    padding:6px 8px;
    font-size:0.8rem;
  }

  button.ghost:hover{
    background:var(--surface-2);
    color:var(--text);
  }

  button.danger-ghost{
    color:var(--red);
  }

  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  /* ---------- Cards ---------- */

  section.cards-panel{
    margin-bottom:34px;
  }

  .cards-panel h2,
  .months h2{
    font-size:0.82rem;
    font-weight:600;
    color:var(--text-dim);
    margin:0 0 12px;
  }

  .cards-scroll{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
  }

  .card-chip{
    position:relative;
    flex:0 0 auto;
    width:190px;
    height:110px;
    border-radius:var(--radius-card);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    color:#fff;
    overflow:hidden;
    box-shadow:0 8px 20px -10px rgba(0,0,0,0.6);
  }

  .card-chip::after{
    content:"";
    position:absolute;
    right:-30px;
    top:-30px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.10);
  }

  .card-chip .chip-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }

  .card-chip .chip-icon{
    width:26px;
    height:18px;
    border-radius:4px;
    background:rgba(255,255,255,0.75);
  }

  .card-chip .chip-actions{
    display:flex;
    gap:2px;
  }

  .card-chip .chip-actions button{
    background:rgba(0,0,0,0.25);
    border:none;
    color:#fff;
    width:24px;
    height:24px;
    padding:0;
    border-radius:6px;
    font-size:0.75rem;
    line-height:1;
  }

  .card-chip .chip-actions button:hover{
    background:rgba(0,0,0,0.45);
  }

  .card-chip .chip-name{
    font-weight:700;
    font-size:1rem;
    letter-spacing:0.01em;
    text-shadow:0 1px 3px rgba(0,0,0,0.25);
  }

  .card-chip .chip-total{
    font-size:0.76rem;
    opacity:0.9;
  }

  .add-card-chip{
    flex:0 0 auto;
    width:190px;
    height:110px;
    border-radius:var(--radius-card);
    border:1.5px dashed var(--border);
    background:transparent;
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:0.85rem;
  }

  .add-card-chip:hover{
    border-color:var(--amber-dim);
    color:var(--amber);
  }

  .empty-note{
    color:var(--text-faint);
    font-size:0.85rem;
    padding:8px 2px;
  }

  /* ---------- Months ---------- */

  .months{
    display:flex;
    flex-direction:column;
  }

  .month-divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0 10px;
    color:var(--text-faint);
    font-size:0.74rem;
  }

  .month-divider::before,
  .month-divider::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--border-soft);
  }

  details.month-row{
    border-bottom:1px solid var(--border-soft);
  }

  details.month-row summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:15px 4px;
    gap:12px;
  }

  details.month-row summary::-webkit-details-marker{
    display:none;
  }

  .month-name{
    font-weight:600;
    font-size:0.96rem;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:170px;
  }

  .month-name .chevron{
    color:var(--text-faint);
    font-size:0.7rem;
    transition:transform .15s ease;
    display:inline-block;
  }

  details[open] .chevron{
    transform:rotate(90deg);
  }

  .month-summary-right{
    display:flex;
    align-items:center;
    gap:16px;
    color:var(--text-dim);
    font-size:0.85rem;
  }

  .month-summary-right .month-total{
    color:var(--text);
    font-weight:700;
    font-size:0.98rem;
  }

  .month-dots{
    display:flex;
    gap:4px;
  }

  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
  }

  .month-body{
    padding:2px 4px 18px 4px;
  }

  .month-empty{
    color:var(--text-faint);
    font-size:0.85rem;
    padding:6px 0 12px;
  }

  table.tx-table{
    width:100%;
    border-collapse:collapse;
    font-size:0.87rem;
  }

  table.tx-table th{
    text-align:left;
    font-weight:500;
    color:var(--text-faint);
    font-size:0.72rem;
    padding:0 8px 8px;
    border-bottom:1px solid var(--border-soft);
  }

  table.tx-table td{
    padding:9px 8px;
    border-bottom:1px solid var(--border-soft);
    vertical-align:middle;
  }

  table.tx-table tr:last-child td{
    border-bottom:none;
  }

  /* ---------- Swipe / Paid ---------- */

  .tx-row{
    transition:
      opacity .2s ease,
      background .2s ease,
      transform .2s ease;
    touch-action:pan-y;
  }

  .tx-row.paid{
    opacity:0.38;
  }

  .tx-row.past{
    opacity:0.38;
  }

  .tx-row.paid.past{
    opacity:0.25;
  }

  .tx-row.swipe-hint{
    background:rgba(69,199,184,0.08);
  }

  .tx-status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-left:7px;
    color:var(--teal);
    font-size:0.68rem;
    font-weight:600;
    white-space:nowrap;
  }

  .tx-status::before{
    content:"✓";
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(69,199,184,0.18);
    font-size:0.65rem;
  }

  .tx-swipe-text{
    color:var(--text-faint);
    font-size:0.65rem;
    margin-top:3px;
  }

  .card-tag{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .card-tag .dot{
    width:10px;
    height:10px;
    flex:0 0 auto;
  }

  .tx-note{
    color:var(--text-dim);
  }

  .tx-progress{
    color:var(--text-faint);
    font-size:0.78rem;
  }

  .tx-amount{
    text-align:right;
    font-weight:600;
  }

  .tx-del{
    color:var(--text-faint);
    background:none;
    border:none;
    padding:2px 6px;
    font-size:0.9rem;
  }

  .tx-del:hover{
    color:var(--red);
  }

  tfoot td{
    padding-top:10px;
    font-weight:700;
    border-bottom:none !important;
  }

  /* ---------- Modal ---------- */

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,8,18,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }

  .modal-overlay.open{
    display:flex;
  }

  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-card);
    width:100%;
    max-width:420px;
    padding:22px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.7);
  }

  .modal h2{
    margin:0 0 16px;
    font-size:1.1rem;
  }

  .field{
    margin-bottom:14px;
  }

  .field label{
    display:block;
    font-size:0.8rem;
    color:var(--text-dim);
    margin-bottom:6px;
  }

  .field input,
  .field select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:0.92rem;
    font-family:inherit;
  }

  .field input:focus,
  .field select:focus{
    outline:none;
    border-color:var(--amber-dim);
  }

  .field-row{
    display:flex;
    gap:12px;
  }

  .field-row .field{
    flex:1;
  }

  .field-row select{
    flex:1;
  }

  .swatches{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .swatch{
    width:28px;
    height:28px;
    border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }

  .swatch.selected{
    border-color:#fff;
  }

  .preview-box{
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-sm);
    padding:10px 12px;
    font-size:0.82rem;
    color:var(--text-dim);
    margin-bottom:14px;
    min-height:20px;
  }

  .preview-box strong{
    color:var(--amber);
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:6px;
  }

  .modal-error{
    color:var(--red);
    font-size:0.8rem;
    margin:-6px 0 12px;
  }

  @media (max-width:520px){

    header.topbar{
      flex-direction:column;
      align-items:flex-start;
    }

    .actions{
      width:100%;
    }

    .actions button{
      flex:1;
    }

    .month-name{
      min-width:0;
    }

    table.tx-table{
      font-size:0.8rem;
    }

    table.tx-table th:nth-child(2),
    table.tx-table td:nth-child(2){
      max-width:90px;
    }

    .tx-status{
      display:flex;
      margin-left:0;
      margin-top:3px;
    }
  }
</style>
</head>

<body>

<div id="app">

  <header class="topbar">

    <div class="brand">
      <h1>Taksit Takip</h1>
      <p>Kredi kartı taksitlerinizi aylara göre planlayın</p>
    </div>

    <div class="summary-row">

      <div class="summary-item">
        <span class="label">Ödenmemiş Taksitler</span>
        <span class="value tabular" id="totalAmount">₺0,00</span>
      </div>

    </div>

    <div class="actions">
      <button id="btnAddTx" class="primary">+ Taksit Ekle</button>
    </div>

  </header>


  <section class="cards-panel">

    <h2>Kartlarım</h2>

    <div class="cards-scroll" id="cardsScroll"></div>

  </section>


  <section class="months">

    <h2>Aylara Göre Taksitler</h2>

    <div id="monthsContainer"></div>

  </section>

</div>


<!-- Kart Modal -->

<div class="modal-overlay" id="cardModalOverlay">

  <div class="modal">

    <h2 id="cardModalTitle">Kart Ekle</h2>

    <div class="field">

      <label for="cardNameInput">Kart Adı</label>

      <input
        id="cardNameInput"
        maxlength="24"
        placeholder="Örn: Bonus Kart"
      >

    </div>

    <div class="field">

      <label>Renk</label>

      <div class="swatches" id="colorSwatches"></div>

    </div>

    <div
      class="modal-error"
      id="cardModalError"
      style="display:none;"
    ></div>

    <div class="modal-actions">

      <button id="cardModalCancel">Vazgeç</button>

      <button id="cardModalSave" class="primary">
        Kaydet
      </button>

    </div>

  </div>

</div>


<!-- Taksit Modal -->

<div class="modal-overlay" id="txModalOverlay">

  <div class="modal">

    <h2>Yeni Taksit Ekle</h2>

    <div class="field">

      <label for="txCardSelect">Kart</label>

      <select id="txCardSelect"></select>

    </div>


    <div class="field-row">

      <div class="field">

        <label for="txAmount">Toplam Tutar (₺)</label>

        <input
          id="txAmount"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          placeholder="0"
        >

      </div>


      <div class="field">

        <label for="txCount">Taksit Sayısı</label>

        <input
          id="txCount"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          value="1"
        >

      </div>

    </div>


    <div class="field">

      <label>İlk Ödeme Ayı</label>

      <div class="field-row">

        <select id="txFirstMonthSel"></select>

        <select id="txFirstYearSel"></select>

      </div>

    </div>


    <div class="field">

      <label for="txNote">Not</label>

      <input
        id="txNote"
        maxlength="60"
      >

    </div>


    <div class="preview-box" id="txPreview">
      Aylık tutarı görmek için formu doldurun.
    </div>


    <div
      class="modal-error"
      id="txModalError"
      style="display:none;"
    ></div>


    <div class="modal-actions">

      <button id="txModalCancel">Vazgeç</button>

      <button id="txModalSave" class="primary">
        Ekle
      </button>

    </div>

  </div>

</div>


<script>

(function(){

  "use strict";


  var STORAGE_KEY = "taksitTakipData_v1";

  var MAX_CARDS = 10;

  var MONTH_NAMES = [
    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"
  ];


  var PALETTE = [
    "#3B5AA6",
    "#2F8F7A",
    "#B5542A",
    "#6B4FA0",
    "#A6472F",
    "#2E7D9E",
    "#8C6D1F",
    "#4A7A3A",
    "#7A3B6B",
    "#3D5A5A"
  ];


  /* ---------------- State ---------------- */

  var state = {
    cards: [],
    transactions: []
  };


  var editingCardId = null;

  var selectedColor = PALETTE[0];


  /* ---------------- Storage ---------------- */

  function loadState(){

    try{

      var raw = localStorage.getItem(STORAGE_KEY);

      if(raw){

        var parsed = JSON.parse(raw);

        if(
          parsed &&
          Array.isArray(parsed.cards) &&
          Array.isArray(parsed.transactions)
        ){

          state = parsed;

        }

      }

    }catch(e){

      console.warn(
        "Depolanan veri okunamadı:",
        e
      );

    }

  }


  function saveState(){

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

    }catch(e){

      console.warn(
        "Veri kaydedilemedi:",
        e
      );

    }

  }


  function uid(){

    return Date.now().toString(36)
      + Math.random()
        .toString(36)
        .slice(2,8);

  }


  /* ---------------- Month helpers ---------------- */

  function currentMonthKey(){

    var d = new Date();

    return d.getFullYear()
      + "-"
      + String(d.getMonth()+1).padStart(2,"0");

  }


  function addMonths(monthKey,n){

    var parts = monthKey.split("-");

    var y = parseInt(parts[0],10);

    var m = parseInt(parts[1],10) - 1;

    var total = y * 12 + m + n;

    var ny = Math.floor(total / 12);

    var nm = ((total % 12) + 12) % 12;

    return ny
      + "-"
      + String(nm+1).padStart(2,"0");

  }


  function monthLabel(monthKey){

    var parts = monthKey.split("-");

    var y = parseInt(parts[0],10);

    var m = parseInt(parts[1],10) - 1;

    return MONTH_NAMES[m]
      + " "
      + y;

  }


  function compareMonths(a,b){

    return a < b
      ? -1
      : (a > b ? 1 : 0);

  }


  /* ---------------- Formatting ---------------- */

  function formatCurrency(n){

    var v =
      Math.round(
        (n + Number.EPSILON) * 100
      ) / 100;

    return "₺"
      + v.toLocaleString(
        "tr-TR",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );

  }


  /* ---------------- Installment math ---------------- */

  function computeInstallmentAmounts(
    total,
    count
  ){

    var base =
      Math.floor(
        (total / count) * 100
      ) / 100;

    var amounts = [];

    var runningSum = 0;

    for(
      var i = 0;
      i < count - 1;
      i++
    ){

      amounts.push(base);

      runningSum += base;

    }


    var last =
      Math.round(
        (total - runningSum) * 100
      ) / 100;

    amounts.push(last);

    return amounts;

  }


  /*
   * Her taksit artık ayrı bir index ile
   * ödenmiş olarak tutulabiliyor.
   *
   * tx.paidInstallments = [1,3,4]
   * örneğin 1., 3. ve 4. taksit ödendi.
   */

  function isInstallmentPaid(
    tx,
    installmentIndex
  ){

    return Array.isArray(tx.paidInstallments)
      && tx.paidInstallments.indexOf(
        installmentIndex
      ) !== -1;

  }


  function setInstallmentPaid(
    tx,
    installmentIndex,
    paid
  ){

    if(!Array.isArray(tx.paidInstallments)){

      tx.paidInstallments = [];

    }


    var index =
      tx.paidInstallments.indexOf(
        installmentIndex
      );


    if(paid){

      if(index === -1){

        tx.paidInstallments.push(
          installmentIndex
        );

      }

    }else{

      if(index !== -1){

        tx.paidInstallments.splice(
          index,
          1
        );

      }

    }

  }


  /*
   * Geçmiş ayların taksitleri toplamdan
   * otomatik olarak çıkarılır.
   *
   * Mevcut ay için ise ayın 16'sından
   * itibaren taksit otomatik ödenmiş kabul edilir.
   */

  function isInstallmentAutomaticallyPaid(
    monthKey
  ){

    var current = currentMonthKey();

    if(monthKey < current){

      return true;

    }

    if(monthKey > current){

      return false;

    }


    var today = new Date();

    return today.getDate() >= 16;

  }


  /*
   * Uygulama açıldığında mevcut ayın
   * otomatik ödenmesi gereken taksitlerini
   * gerçek veri içine de kaydediyoruz.
   */

  function applyAutomaticPayments(){

    var current = currentMonthKey();

    var today = new Date();

    if(today.getDate() < 16){

      return;

    }


    var changed = false;


    state.transactions.forEach(function(tx){

      for(
        var i = 0;
        i < tx.count;
        i++
      ){

        var mk =
          addMonths(
            tx.firstMonth,
            i
          );


        if(mk === current){

          if(
            !isInstallmentPaid(
              tx,
              i + 1
            )
          ){

            setInstallmentPaid(
              tx,
              i + 1,
              true
            );

            changed = true;

          }

        }

      }

    });


    if(changed){

      saveState();

    }

  }


  /*
   * Returns map:
   *
   * monthKey -> [
   *   {
   *     cardId,
   *     amount,
   *     note,
   *     txId,
   *     index,
   *     count,
   *     paid
   *   }
   * ]
   */

  function buildBreakdown(){

    var map = {};


    state.transactions.forEach(function(tx){

      var amounts =
        computeInstallmentAmounts(
          tx.totalAmount,
          tx.count
        );


      for(
        var i = 0;
        i < tx.count;
        i++
      ){

        var mk =
          addMonths(
            tx.firstMonth,
            i
          );


        if(!map[mk]){

          map[mk] = [];

        }


        map[mk].push({

          cardId: tx.cardId,

          amount: amounts[i],

          note: tx.note,

          txId: tx.id,

          index: i + 1,

          count: tx.count,

          paid:
            isInstallmentPaid(
              tx,
              i + 1
            )
            ||
            isInstallmentAutomaticallyPaid(
              mk
            )

        });

      }

    });


    return map;

  }


  /*
   * Geçmiş 12 ay + mevcut ay + gelecek 11 ay
   * gösterilir.
   */

  function getVisibleMonths(
    breakdown
  ){

    var current = currentMonthKey();

    var months = [];


    for(
      var i = -12;
      i <= 11;
      i++
    ){

      months.push(
        addMonths(
          current,
          i
        )
      );

    }


    var standardSet = {};

    months.forEach(function(mk){

      standardSet[mk] = true;

    });


    /*
     * 12 aylık geleceği aşan taksitler varsa
     * ayrıca göstermeye devam ediyoruz.
     */

    var extraMonths =
      Object.keys(breakdown)
        .filter(function(mk){

          return !standardSet[mk]
            &&
            compareMonths(
              mk,
              months[months.length - 1]
            ) > 0;

        });


    extraMonths.sort(compareMonths);


    return {

      standard: months,

      extra: extraMonths

    };

  }

  function getCard(id){

  function nextAvailableColor(){

    var used = {};


    state.cards.forEach(function(c){

      used[c.color] = true;

    });


    for(
      var i=0;
      i<PALETTE.length;
      i++
    ){

      if(!used[PALETTE[i]]){

        return PALETTE[i];

      }

    }


    return PALETTE[
      state.cards.length
      % PALETTE.length
    ];

  }


  /*
   * Kart üzerindeki toplam:
   * geçmiş aylar ve ödenmiş taksitler dahil edilmez.
   */

  function cardTotal(cardId){

    var sum = 0;

    var current =
      currentMonthKey();


    state.transactions.forEach(
      function(tx){

        if(tx.cardId !== cardId){

          return;

        }


        var amounts =
          computeInstallmentAmounts(
            tx.totalAmount,
            tx.count
          );


        for(
          var i=0;
          i<tx.count;
          i++
        ){

          var mk =
            addMonths(
              tx.firstMonth,
              i
            );


          var paid =
            isInstallmentPaid(
              tx,
              i+1
            )
            ||
            isInstallmentAutomaticallyPaid(
              mk
            );


          if(
            mk >= current
            &&
            !paid
          ){

            sum += amounts[i];

          }

        }

      }
    );


    return sum;

  }

  function shade(
    hex,
    percent
  ){

    var num =
      parseInt(
        hex.replace("#",""),
        16
      );


    var r =
      (num >> 16)
      + Math.round(
          2.55 * percent
        );


    var g =
      ((num >> 8) & 0x00FF)
      + Math.round(
          2.55 * percent
        );


    var b =
      (num & 0x0000FF)
      + Math.round(
          2.55 * percent
        );


    r =
      Math.min(
        255,
        Math.max(0,r)
      );


    g =
      Math.min(
        255,
        Math.max(0,g)
      );


    b =
      Math.min(
        255,
        Math.max(0,b)
      );


    return "#"
      + (
        0x1000000
        + r * 0x10000
        + g * 0x100
        + b
      )
        .toString(16)
        .slice(1);

  }

  function renderMonthRow(

      );

    details.className =
      "month-row";


    /*
     * Geçmiş ayları varsayılan olarak

    }


    var summary =

      );

        "div"
      );

    nameEl.className =
      "month-name";

    nameEl.innerHTML =
      "<span class=\"chevron\">▸</span>"
      + monthLabel(
          monthKey
        );


    var right =
      document.createElement(
        "div"
      );

    right.className =
      "month-summary-right";


    var dots =
      document.createElement(
        "div"
      );

    dots.className =
      "month-dots";


    var seenCards = {};


    items.forEach(
      function(it){

        if(!seenCards[it.cardId]){

          seenCards[it.cardId] = true;


          var card =
            getCard(
              it.cardId
            );


          var dot =
            document.createElement(
              "div"
            );

          dot.className =
            "dot";

          dot.style.background =
            card
              ? card.color
              : "#666";


          dots.appendChild(
            dot
          );

        }

      }
    );


    /*
     * Ay toplamı:
     * geçmiş ayların toplamı sadece
     * görsel amaçlı gösterilir.
     */

    var monthSum =
      items.reduce(
        function(s,it){

          return s + it.amount;

        },
        0
      );


    var unpaidMonthSum =
      items.reduce(
        function(s,it){

          if(
            !it.paid
            &&
            !isPast
          ){

            return s + it.amount;

          }

          return s;

        },
        0
      );


    var totalEl =
      document.createElement(
        "div"
      );

    totalEl.className =
      "month-total tabular";


    totalEl.textContent =
      isPast

            monthSum

            unpaidMonthSum

    right.appendChild(
      dots
    );

    right.appendChild(
      totalEl
    );


    summary.appendChild(
      nameEl
    );

    summary.appendChild(
      right
    );

      summary

        "div"

          "div"

        + "<th>Not</th>"
        + "<th>Taksit</th>"
        + "<th style=\"text-align:right;\">Tutar</th>"
        + "<th></th>"

            /*

            /*

  /* ---------------- Swipe ---------------- */

  function addSwipeHandler(
    element,
    txId,
    installmentIndex,
    isPast
  ){

    /*
     * Geçmiş aylarda manuel ödeme değişikliğine
     * gerek yok; zaten ödenmiş kabul ediliyor.
     */

    if(isPast){

      return;

    }


    var startX = null;

    var startY = null;

    var currentX = null;


    element.addEventListener(
      "touchstart",
      function(e){

        if(
          !e.touches
          ||
          !e.touches.length
        ){

          return;

        }


        startX =
          e.touches[0].clientX;

        startY =
          e.touches[0].clientY;

        currentX = startX;

      },
      {
        passive:true
      }
    );


    element.addEventListener(
      "touchmove",
      function(e){

        if(
          startX === null
          ||
          !e.touches
          ||
          !e.touches.length
        ){

          return;

        }


        currentX =
          e.touches[0].clientX;


        var currentY =
          e.touches[0].clientY;


        var dx =
          currentX - startX;


        var dy =
          currentY - startY;


        /*
         * Yatay hareket belirginse
         * hafif görsel geri bildirim.
         */

        if(
          dx > 25
          &&
          Math.abs(dx) > Math.abs(dy)
        ){

          element.classList.add(
            "swipe-hint"
          );

        }

      },
      {
        passive:true
      }
    );


    element.addEventListener(
      "touchend",
      function(){

        if(
          startX === null
          ||
          currentX === null
        ){

          return;

        }


        var dx =
          currentX - startX;


        /*
         * En az 70px sağa kaydırma.
         */

        if(dx >= 70){

          toggleInstallmentPaid(
            txId,
            installmentIndex
          );

        }


        startX = null;

        startY = null;

        currentX = null;


        element.classList.remove(
          "swipe-hint"
        );

      },
      {
        passive:true
      }
    );

  }


  function toggleInstallmentPaid(
    txId,
    installmentIndex
  ){

    var tx =
      state.transactions.find(
        function(t){

          return t.id === txId;

        }
      );


    if(!tx){

      return;

    }


    var paid =
      isInstallmentPaid(
        tx,
        installmentIndex
      );


    setInstallmentPaid(
      tx,
      installmentIndex,
      !paid
    );


    saveState();

    renderAll();

  }

    document.getElementById(
      "cardNameInput"
    ).value =
      card
        ? card.name
        : "";


    selectedColor =
      card
        ? card.color
        : nextAvailableColor();


    renderSwatches();

    hideError(
      "cardModalError"
    );


    document.getElementById(
      "cardModalOverlay"
    ).classList.add(
      "open"
    );


    document.getElementById(
      "cardNameInput"
    ).focus();

  }


  function closeCardModal(){

    document.getElementById(
      "cardModalOverlay"
    ).classList.remove(
      "open"
    );

  }


  function renderSwatches(){

    var wrap =
      document.getElementById(
        "colorSwatches"
      );


    wrap.innerHTML = "";


    PALETTE.forEach(
      function(color){

        var sw =
          document.createElement(
            "div"
          );


        sw.className =
          "swatch"
          + (
            color === selectedColor
              ? " selected"
              : ""
          );


        sw.style.background =
          color;


        sw.addEventListener(
          "click",
          function(){

            selectedColor =
              color;

            renderSwatches();

          }
        );


        wrap.appendChild(
          sw
        );

      }
    );

  }


  function saveCard(){

    var name =
      document.getElementById(
        "cardNameInput"
      ).value.trim();


    if(!name){

      showError(
        "cardModalError",
        "Lütfen kart için bir ad girin."
      );

      return;

    }


    if(editingCardId){

      var card =
        getCard(
          editingCardId
        );


      card.name =
        name;

      card.color =
        selectedColor;

    }else{

      if(
        state.cards.length
        >= MAX_CARDS
      ){

        showError(
          "cardModalError",
          "En fazla "
          + MAX_CARDS
          + " kart ekleyebilirsiniz."
        );

        return;

      }


      state.cards.push({

        id:uid(),

        name:name,

        color:selectedColor

      });

    }


    saveState();

    renderAll();

    closeCardModal();

  }


  function deleteCard(
    cardId
  ){

    var relatedCount =
      state.transactions.filter(
        function(tx){

          return tx.cardId === cardId;

        }
      ).length;


    var msg =
      relatedCount > 0
        ? "Bu karta ait "
          + relatedCount
          + " taksit kaydı da silinecek. Devam edilsin mi?"
        : "Bu kartı silmek istediğinize emin misiniz?";


    if(!confirm(msg)){

      return;

    }


    state.cards =
      state.cards.filter(
        function(c){

          return c.id !== cardId;

        }
      );


    state.transactions =
      state.transactions.filter(
        function(tx){

          return tx.cardId !== cardId;

        }
      );


    saveState();

    renderAll();

  }


  /* ---------------- Transaction modal ---------------- */

  function openTxModal(){

    if(state.cards.length === 0){

      alert(
        "Taksit ekleyebilmek için önce bir kart eklemelisiniz."
      );

      return;

    }


    document.getElementById(
      "txAmount"
    ).value = "";


    document.getElementById(
      "txCount"
    ).value = "1";


    setMonthYearSelects(
      currentMonthKey()
    );


    document.getElementById(
      "txNote"
    ).value = "";


    hideError(
      "txModalError"
    );


    updateTxPreview();


    document.getElementById(
      "txModalOverlay"
    ).classList.add(
      "open"
    );


    /*
     * Kart alanına değil, tutar alanına
     * odaklanmıyoruz; böylece modal açılır açılmaz
     * klavye kendiliğinden açılmaz.
     */

  }


  function closeTxModal(){

    document.getElementById(
      "txModalOverlay"
    ).classList.remove(
      "open"
    );

  }


  function populateCardSelect(){

    var select =
      document.getElementById(
        "txCardSelect"
      );


    var currentVal =
      select.value;


    select.innerHTML = "";


    state.cards.forEach(
      function(card){

        var opt =
          document.createElement(
            "option"
          );


        opt.value =
          card.id;


        opt.textContent =
          card.name;


        select.appendChild(
          opt
        );

      }
    );


    if(currentVal){

      select.value =
        currentVal;

    }

  }


  function updateTxPreview(){

    var rawAmount =
      document.getElementById(
        "txAmount"
      ).value || "";


    /*
     * Hem virgül hem nokta kabul edilir.
     */

    var amount =
      parseFloat(
        rawAmount
          .replace(/\./g,"")
          .replace(",",".")
      );


    /*
     * Eğer kullanıcı sadece rakam girmişse
     * doğrudan kullan.
     */

    if(
      /^\d+$/.test(
        rawAmount
      )
    ){

      amount =
        parseFloat(
          rawAmount
        );

    }


    var count =
      parseInt(
        document.getElementById(
          "txCount"
        ).value,
        10
      );


    var firstMonth =
      getSelectedFirstMonth();


    var box =
      document.getElementById(
        "txPreview"
      );


    if(
      !amount
      ||
      amount <= 0
      ||
      !count
      ||
      count < 1
      ||
      !firstMonth
    ){

      box.innerHTML =
        "Aylık tutarı görmek için formu doldurun.";

      return;

    }


    var amounts =
      computeInstallmentAmounts(
        amount,
        count
      );


    var lastMonth =
      addMonths(
        firstMonth,
        count - 1
      );


    box.innerHTML =
      "Aylık taksit: <strong>"
      + formatCurrency(
          amounts[0]
        )
      + "</strong> · "
      + "Başlangıç: "
      + monthLabel(
          firstMonth
        )
      + " · Bitiş: "
      + monthLabel(
          lastMonth
        );

  }


  function parseAmount(value){

    var v =
      String(value || "")
        .trim();


    if(!v){

      return NaN;

    }


    /*
     * Türkçe ondalık kullanımını destekler.
     *
     * Örn:
     * 12500
     * 12500,50
     */

    if(
      v.indexOf(",") !== -1
    ){

      v =
        v.replace(/\./g,"")
         .replace(",",".")
         ;

    }


    return parseFloat(v);

  }


  function saveTx(){

    var cardId =
      document.getElementById(
        "txCardSelect"
      ).value;


    var amount =
      parseAmount(
        document.getElementById(
          "txAmount"
        ).value
      );


    var count =
      parseInt(
        document.getElementById(
          "txCount"
        ).value,
        10
      );


    var firstMonth =
      getSelectedFirstMonth();


    var note =
      document.getElementById(
        "txNote"
      ).value.trim();


    if(!cardId){

      showError(
        "txModalError",
        "Lütfen bir kart seçin."
      );

      return;

    }


    if(
      isNaN(amount)
      ||
      amount <= 0
    ){

      showError(
        "txModalError",
        "Lütfen geçerli bir tutar girin."
      );

      return;

    }


    if(
      !count
      ||
      count < 1
    ){

      showError(
        "txModalError",
        "Taksit sayısı en az 1 olmalıdır."
      );

      return;

    }


    if(!firstMonth){

      showError(
        "txModalError",
        "Lütfen ilk ödeme ayını seçin."
      );

      return;

    }


    state.transactions.push({

      id:uid(),

      cardId:cardId,

      totalAmount:
        Math.round(
          amount * 100
        ) / 100,

      count:count,

      firstMonth:firstMonth,

      note:note,

      /*
       * Yeni işlem ilk oluşturulduğunda
       * henüz hiçbir taksit ödenmiş değildir.
       */

      paidInstallments:[]

    });


    saveState();

    renderAll();

    closeTxModal();

  }


  function deleteTransaction(
    txId
  ){

    if(
      !confirm(
        "Bu taksit kaydını silmek istediğinize emin misiniz?"
      )
    ){

      return;

    }


    state.transactions =
      state.transactions.filter(
        function(tx){

          return tx.id !== txId;

        }
      );


    saveState();

    renderAll();

  }


  /* ---------------- Utilities ---------------- */

  function showError(
    id,
    msg
  ){

    var el =
      document.getElementById(
        id
      );


    el.textContent =
      msg;


    el.style.display =
      "block";

  }


  function hideError(id){

    var el =
      document.getElementById(
        id
      );


    el.style.display =
      "none";

  }


  /* ---------------- Event wiring ---------------- */

  document.getElementById(
    "btnAddTx"
  ).addEventListener(
    "click",
    openTxModal
  );


  document.getElementById(
    "cardModalCancel"
  ).addEventListener(
    "click",
    closeCardModal
  );


  document.getElementById(
    "cardModalSave"
  ).addEventListener(
    "click",
    saveCard
  );


  document.getElementById(
    "cardModalOverlay"
  ).addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeCardModal();

      }

    }
  );


  document.getElementById(
    "txModalCancel"
  ).addEventListener(
    "click",
    closeTxModal
  );


  document.getElementById(
    "txModalSave"
  ).addEventListener(
    "click",
    saveTx
  );


  document.getElementById(
    "txModalOverlay"
  ).addEventListener(
    "click",
    function(e){

      if(e.target === this){

        closeTxModal();

      }

    }
  );


  /*
   * Artık özel numpad yok.
   * Sistem klavyesi input alanlarına bağlı.
   */

  document.getElementById(
    "txAmount"
  ).addEventListener(
    "input",
    updateTxPreview
  );


  document.getElementById(
    "txCount"
  ).addEventListener(
    "input",
    updateTxPreview
  );


  document.getElementById(
    "txNote"
  ).addEventListener(
    "focus",
    function(){

      /*
       * Sistem klavyesinin normal davranışı.
       */

    }
  );


  [
    "txFirstMonthSel",
    "txFirstYearSel"
  ].forEach(
    function(id){

      document.getElementById(
        id
      ).addEventListener(
        "change",
        updateTxPreview
      );

    }
  );


  /*
   * Sayısal alanlara yalnızca rakam,
   * virgül ve nokta kabul ediyoruz.
   *
   * Klavye yine sistem klavyesi.
   */

  document.getElementById(
    "txAmount"
  ).addEventListener(
    "input",
    function(){

      this.value =
        this.value.replace(
          /[^0-9,.]/g,
          ""
        );

      updateTxPreview();

    }
  );


  document.getElementById(
    "txCount"
  ).addEventListener(
    "input",
    function(){

      this.value =
        this.value.replace(
          /[^0-9]/g,
          ""
        );

      updateTxPreview();

    }
  );


  document.addEventListener(
    "keydown",
    function(e){

      if(e.key === "Escape"){

        closeCardModal();

        closeTxModal();

      }

    }
  );


  /* ---------------- Init ---------------- */

  populateMonthYearSelects();

  loadState();

  renderAll();

})();

</script>

</body>
</html>
